namespace: Tests
support_namespace: Support
paths:
    tests: tests
    output: tests/_output
    data: tests/Support/Data
    support: tests/Support
    envs: tests/_envs
actor_suffix: Tester
# Переменные окружения доступны в конфигах сьютов как %NAME% (нужны для --env stage)
params:
    - env
settings:
    colors: true
    report_useless_tests: true
extensions:
    enabled:
        - Codeception\Extension\RunFailed
