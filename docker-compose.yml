services:
  selenium:
    image: selenium/standalone-chrome:latest
    shm_size: 2gb
    ports:
      - "4444:4444"   # WebDriver
      - "7900:7900"   # noVNC: http://localhost:7900 (пароль: secret) — смотреть прогон вживую
    environment:
      SE_NODE_MAX_SESSIONS: 2
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
