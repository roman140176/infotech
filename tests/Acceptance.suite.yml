# UI-тесты на живом стенде в настоящем браузере (Selenium).
# PhpBrowser не подходит: перед сайтом стоит JS-челлендж ServicePipe,
# без выполнения JavaScript форма входа не отдаётся.

actor: AcceptanceTester
modules:
    enabled:
        - WebDriver:
            url: https://stellantis.autocrm.ru
            browser: chrome
            host: 127.0.0.1
            port: 4444
            window_size: 1366x768
            restart: true
            clear_cookies: true
            capabilities:
                goog:chromeOptions:
                    args: ["--lang=ru-RU"]
        - Asserts
        # Тестовый пользователь для тестов группы needs-test-user.
        # По умолчанию пишет в локальный SQLite (реальная БД не нужна),
        # в окружении stage — в БД тестового стенда.
        - Db:
            dsn: 'sqlite:tests/_output/stella_test.sqlite'
            user: ''
            password: ''
            dump: tests/Support/Data/user_schema.sql
            populate: true
            cleanup: false
        - Tests\Support\Helper\TestUserHelper:
            depends: Db
step_decorators:
    - Codeception\Step\ConditionalAssertion
    - Codeception\Step\TryTo
    - Codeception\Step\Retry

env:
    # vendor/bin/codecept run Acceptance --env stage
    # STAGE_URL, STAGE_DB_DSN, STAGE_DB_USER, STAGE_DB_PASSWORD — из переменных окружения
    stage:
        modules:
            config:
                WebDriver:
                    url: '%STAGE_URL%'
                Db:
                    dsn: '%STAGE_DB_DSN%'
                    user: '%STAGE_DB_USER%'
                    password: '%STAGE_DB_PASSWORD%'
                    populate: false
